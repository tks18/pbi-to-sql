[project]
name = "pbi-to-sql"
version = "1.0.0"
description = "Turn your Power BI model into a fully queryable SQL database — like a data wizard, but with Gen Z energy."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.21.0",
    "apache-airflow>=3.1.3",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.4",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.1",
]
